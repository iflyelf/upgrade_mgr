# upgrade-mgr 配置示例
# 优先级：环境变量 > 本文件默认；运行期「设置页」(app_settings) 覆盖为最高。
# 必填：database；可选：consul / casdoor / redis（缺失仅降级，不阻塞启动）。

server:
  host: 0.0.0.0
  port: 8090
  web_embedded: true
  session_secret: ""          # 会话密钥；留空则自动生成并持久化到数据库（多副本/重启共享），生产建议显式 32+ 字节
  external_url: ""            # Agent/浏览器实际访问地址；直连示例 http://10.0.56.118:8090（env SERVER_EXTERNAL_URL）
  trust_proxy: false          # 是否信任 X-Forwarded-For；无反向代理保持 false（env TRUST_PROXY）
  trusted_proxies: []         # 受信代理 IP/CIDR（env TRUSTED_PROXIES，逗号分隔）；XFF 从右往左跳过这些地址
  cookie_secure: "auto"       # 会话 Cookie Secure：auto/true/false；纯 HTTP 用 auto 或 false（env COOKIE_SECURE）
  cors_origins: []
  metrics_token: ""           # /metrics Bearer 令牌（env METRICS_TOKEN）；留空则需登录会话
  agent_binary_dir: ./dist    # Agent 二进制目录（env AGENT_BINARY_DIR），供 /api/agent/binary/{name} 下载
                              # 文件名：upgrade-agent-<os>-<arch>[-legacy][.exe]
                              # 例：upgrade-agent-linux-amd64、upgrade-agent-windows-amd64.exe
                              # 接入 Windows 主机时必须放入 windows-*.exe，否则下载 404

  # 外部文件代缓存（可选）：由控制台代下载公网文件，主机用 http 拉取。
  # 用于老系统（Windows Server 2008 R2 + PowerShell 2.0）不支持 TLS 1.2 的场景。
  # 键 = /api/external/binary/{name} 中的 name；值 = 上游 URL，前缀 script: 表示文本脚本。
  # 留空使用内置默认（windows_exporter amd64/arm64 与 install.ps1）。
  # 也可在「设置 → 外部文件代缓存」页面维护，保存后立即生效（热加载）。
  external_binaries: {}
  #   windows-exporter-amd64: https://github.com/iflyelf/windows_exporter/releases/download/latest/windows_exporter-amd64.exe
  #   windows-exporter-install.ps1: script:https://raw.githubusercontent.com/iflyelf/upgrade_mgr/main/examples/windows_exporter/install.ps1

  # 允许代下载的上游域名（逗号分隔）；留空用默认
  # github.com / raw.githubusercontent.com / proxy.xiaonuo.live。
  # 接口还会拒绝解析到内网/环回地址的主机，防止被当作 SSRF 跳板。
  external_binary_hosts: []
  # 缓存有效期（env EXTERNAL_BINARY_TTL）；留空默认 24h。
  external_binary_ttl: 24h
  # 是否允许代下载内网/环回地址；默认 false（防 SSRF）。
  # 内网镜像站（http://nexus.corp:8081）可选择：
  #   1) 只放行网段（推荐）：external_binary_allow_cidrs: ["10.0.0.0/8"]
  #   2) 或整体放开：external_binary_allow_private: true
  external_binary_allow_private: false
  # 允许访问的内网网段/IP（逗号分隔或 YAML 列表）。为空表示拒绝所有内网地址。
  external_binary_allow_cidrs: []

database:                     # 必填
  dsn: ""                     # 优先使用；如 postgresql://user:pass@host:5432/upgrade_mgr?sslmode=disable
  host: localhost
  port: 5432
  user: postgres
  password: ""
  dbname: upgrade_mgr
  sslmode: disable
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 3600

auth:
  provider: builtin           # builtin(内置账号) 或 casdoor(FlyIAM SSO)
  admin_username: admin
  admin_password: ""          # 明文或 bcrypt 哈希（env ADMIN_PASSWORD）；留空则首次启动随机生成并仅打印一次

consul:                       # 可选：主机与业务分组数据源
  enabled: false
  address: ""                 # 如 http://10.0.56.118:8500
  token: ""                   # 建议用环境变量 CONSUL_TOKEN 覆盖
  datacenter: ""              # 留空自动探测（Agent API → Catalog 兜底）
  timeout: 10
  concurrency: 16
  sync_on_start: false
  sync_interval: ""           # 如 5m / 1h，留空不定时

consul_mgr:                   # 可选：从 consul_mgr 同步主机（覆盖多服务组/多套 Consul）
  endpoint: ""                # consul_mgr 后端地址（env CONSUL_MGR_ENDPOINT）
  service_token: ""           # 需与 consul_mgr「设置 → 服务间 API」一致（env CONSUL_MGR_SERVICE_TOKEN）
  timeout: 30                 # 请求超时秒数（env CONSUL_MGR_TIMEOUT）
  group_id: 0                 # 只同步指定服务组；0=全部启用的组（env CONSUL_MGR_GROUP_ID）
# 字段映射（哪个来源键写到哪个本地字段）不在配置文件里，
# 存于 host_field_mappings 表，在「人员组织 → 主机字段映射」中维护。

casdoor:                      # 可选：与 consul_mgr 共用 FlyIAM 实现 SSO（auth.provider=casdoor 时启用）
  endpoint: ""                # 服务端访问 Casdoor 地址，如 http://10.0.56.118:8000
  public_endpoint: ""         # 浏览器访问地址；留空复用 endpoint
  client_id: ""
  client_secret: ""
  certificate: ""             # 可选（预留）
  organization: flyiam
  application: flyiam
  redirect_uri: ""            # 留空按 server.external_url + /api/auth/callback 推导

redis:                        # 可选：页面响应缓存（只读 API），不可用时自动降级
  enabled: false              # 也可在「设置 → Redis 缓存」启用（env REDIS_ENABLED）
  mode: single                # single / cluster / sentinel（env REDIS_MODE）
  host: localhost             # 单点地址（env REDIS_HOST）；可写成 host:port
  port: 6379                  # env REDIS_PORT
  hosts: []                   # 多地址：集群种子节点 / 哨兵地址（env REDIS_ADDRS，逗号分隔）
  master_name: ""             # 哨兵模式必填（env REDIS_MASTER_NAME）
  password: ""                # env REDIS_PASSWORD（页面设置保存后加密占位显示）
  db: 0                       # env REDIS_DB；集群固定 0；超出 servers 范围自动回退并提示
  ttl: 10                     # 只读列表缓存秒数，上限 30（env REDIS_CACHE_TTL）
  hosts_ttl: 0                # /api/hosts 单独 TTL 秒数，0=沿用 ttl，上限 300（env REDIS_HOSTS_TTL）
                              # 主机上万台时该查询最重，可调到 60-120；写操作仍立即失效
  prefix: "upgrade_mgr:"      # 键前缀，与同实例其它系统隔离（env REDIS_PREFIX）

artifact:
  dir: /var/lib/upgrade_mgr/artifacts
  max_size: 0
  storage_type: local         # local/s3/oss
  # S3/MinIO 配置（storage_type=s3 时）
  # s3_endpoint: http://minio:9000
  # s3_region: us-east-1
  # s3_bucket: artifacts
  # s3_access_key: ""
  # s3_secret_key: ""
  # s3_use_ssl: false
  # 阿里云 OSS 配置（storage_type=oss 时）
  # oss_endpoint: oss-cn-hangzhou.aliyuncs.com
  # oss_bucket: artifacts
  # oss_access_key: ""
  # oss_secret_key: ""

agent:
  poll_hold: 20               # 长轮询挂起秒数
  lease_max: 1h               # 升级维护窗口上限
  clock_skew: 5m              # 指令时间戳允许偏移
  enroll_token_ttl: 15m
  require_enroll_token: true  # 是否强制要求注册令牌（生产环境强烈建议开启）
  allow_exec_mode: true       # 允许 exec/replace_exec/script 模式与命令任务（默认开启；如只需二进制替换可关闭）
  auto_update: false          # 心跳/注册发现旧 Agent 时自动下发自升级（需 dist 中已有目标二进制）

log:
  level: info
