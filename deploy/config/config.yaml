# upgrade-mgr 配置示例
# 优先级：环境变量 > 本文件默认；运行期「设置页」(app_settings) 覆盖为最高。
# 必填：database；可选：consul / casdoor / redis（缺失仅降级，不阻塞启动）。

server:
  host: 0.0.0.0
  port: 8090
  web_embedded: true
  session_secret: ""          # 会话密钥；留空则自动生成并持久化到数据库（多副本/重启共享），生产建议显式 32+ 字节
  external_url: ""            # Agent/浏览器实际访问地址；直连示例 http://10.0.56.118:8090（env SERVER_EXTERNAL_URL）
  trust_proxy: false          # 是否信任 X-Forwarded-For；无反向代理保持 false（env TRUST_PROXY）
  trusted_proxies: []         # 受信代理 IP/CIDR（env TRUSTED_PROXIES，逗号分隔）；XFF 从右往左跳过这些地址
  cookie_secure: "auto"       # 会话 Cookie Secure：auto/true/false；纯 HTTP 用 auto 或 false（env COOKIE_SECURE）
  cors_origins: []
  metrics_token: ""           # /metrics Bearer 令牌（env METRICS_TOKEN）；留空则需登录会话
  agent_binary_dir: ./dist    # Agent 二进制目录（env AGENT_BINARY_DIR），供 /api/agent/binary/{name} 下载

database:                     # 必填
  dsn: ""                     # 优先使用；如 postgresql://user:pass@host:5432/upgrade_mgr?sslmode=disable
  host: localhost
  port: 5432
  user: postgres
  password: ""
  dbname: upgrade_mgr
  sslmode: disable
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 3600

auth:
  provider: builtin           # builtin(内置账号) 或 casdoor(FlyIAM SSO)
  admin_username: admin
  admin_password: ""          # 明文或 bcrypt 哈希（env ADMIN_PASSWORD）；留空则首次启动随机生成并仅打印一次

consul:                       # 可选：主机与业务分组数据源
  enabled: false
  address: ""                 # 如 http://10.0.56.118:8500
  token: ""                   # 建议用环境变量 CONSUL_TOKEN 覆盖
  datacenter: ""              # 留空自动探测（Agent API → Catalog 兜底）
  timeout: 10
  concurrency: 16
  sync_on_start: false
  sync_interval: ""           # 如 5m / 1h，留空不定时

casdoor:                      # 可选：与 consul_mgr 共用 FlyIAM 实现 SSO（auth.provider=casdoor 时启用）
  endpoint: ""                # 服务端访问 Casdoor 地址，如 http://10.0.56.118:8000
  public_endpoint: ""         # 浏览器访问地址；留空复用 endpoint
  client_id: ""
  client_secret: ""
  certificate: ""             # 可选（预留）
  organization: flyiam
  application: flyiam
  redirect_uri: ""            # 留空按 server.external_url + /api/auth/callback 推导

redis:                        # 可选：缓存
  enabled: false
  host: localhost
  port: 6379
  password: ""
  db: 0
  ttl: 300

artifact:
  dir: /var/lib/upgrade_mgr/artifacts
  max_size: 0
  storage_type: local         # local/s3/oss
  # S3/MinIO 配置（storage_type=s3 时）
  # s3_endpoint: http://minio:9000
  # s3_region: us-east-1
  # s3_bucket: artifacts
  # s3_access_key: ""
  # s3_secret_key: ""
  # s3_use_ssl: false
  # 阿里云 OSS 配置（storage_type=oss 时）
  # oss_endpoint: oss-cn-hangzhou.aliyuncs.com
  # oss_bucket: artifacts
  # oss_access_key: ""
  # oss_secret_key: ""

agent:
  poll_hold: 20               # 长轮询挂起秒数
  lease_max: 1h               # 升级维护窗口上限
  clock_skew: 5m              # 指令时间戳允许偏移
  enroll_token_ttl: 15m
  require_enroll_token: true  # 是否强制要求注册令牌（生产环境强烈建议开启）
  allow_exec_mode: false      # 是否允许 exec/replace_exec 部署模式

log:
  level: info
