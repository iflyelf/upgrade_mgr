version: '3.8'

services:
  upgrade-mgr:
    image: iflyelf/upgrade-mgr:latest
    container_name: upgrade-mgr
    restart: always
    ports:
      - "8090:8090"
    volumes:
      - ./config/config.yaml:/etc/upgrade-mgr/config.yaml:ro
      - ./data/artifacts:/data/artifacts
      - ./logs:/var/log/upgrade-mgr
      # 需要接入 Windows / 其他架构主机时放开：把宿主 ./dist 挂进 Agent 下载目录
      # （文件名需为 upgrade-agent-<os>-<arch>[-legacy][.exe]）
      # - ./dist:/opt/upgrade-mgr/dist:ro
    environment:
      # 可选：通过环境变量覆盖配置
      - TZ=Asia/Shanghai
      # - DATABASE_URL=postgresql://user:pass@postgres:5432/upgrade_mgr?sslmode=disable
      # - SERVER_EXTERNAL_URL=http://10.0.88.88:8090
      # - TRUST_PROXY=false
      # - COOKIE_SECURE=auto
      # - ADMIN_PASSWORD=your-strong-password
      # - SESSION_SECRET=your-session-secret
      # 可选：Redis 页面缓存（单点/集群/哨兵；也可在页面「设置 → Redis 连接配置」填写）
      # - REDIS_ENABLED=true
      # - REDIS_MODE=single            # single / cluster / sentinel
      # - REDIS_HOST=redis
      # - REDIS_PORT=6379
      # - REDIS_ADDRS=10.0.0.1:6379,10.0.0.2:6379   # 集群种子 / 哨兵地址
      # - REDIS_MASTER_NAME=mymaster   # sentinel 必填
      # - REDIS_PASSWORD=your-redis-password
      # - REDIS_DB=0                   # cluster 固定 0；超范围自动回退
      # - REDIS_CACHE_TTL=10           # 列表缓存秒数，上限 30
      # - REDIS_PREFIX=upgrade_mgr:
      # - ARTIFACT_MAX_CONCURRENT_UPLOADS=4   # 每个上传占用一条 advisory lock 连接
      # - ARTIFACT_LOCK_WAIT=30m              # 跨副本同组件上传/删除锁等待上限
    networks:
      - upgrade-net
    depends_on:
      - postgres
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: upgrade-mgr-postgres
    restart: always
    environment:
      - POSTGRES_DB=upgrade_mgr
      - POSTGRES_USER=upgrade_mgr
      - POSTGRES_PASSWORD=upgrade_mgr_password
      - TZ=Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - upgrade-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upgrade_mgr"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  upgrade-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
