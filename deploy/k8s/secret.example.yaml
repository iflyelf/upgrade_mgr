# upgrade-mgr 运行时 Secret 模板。
#
# 复制后填入真实值再 apply，切勿把填好的文件提交到 Git：
#   cp deploy/k8s/secret.example.yaml /tmp/upgrade-mgr-secret.yaml
#   vi /tmp/upgrade-mgr-secret.yaml
#   kubectl apply -f /tmp/upgrade-mgr-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: upgrade-mgr-secrets
  namespace: upgrade-mgr
type: Opaque
stringData:
  DATABASE_URL: "postgresql://upgrade_mgr:CHANGE_ME@postgres.example.com:5432/upgrade_mgr?sslmode=disable"
  ADMIN_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  # 建议显式设置 32+ 字节随机串；留空/删除时程序会生成一次并持久化到数据库，
  # 多副本和重启会自动共享。
  # SESSION_SECRET: "CHANGE_ME_32_BYTES_RANDOM"

  # 制品 S3/OSS 凭据（ConfigMap 只放 endpoint/bucket，不放密钥）。
  ARTIFACT_S3_ACCESS_KEY: "CHANGE_ME"
  ARTIFACT_S3_SECRET_KEY: "CHANGE_ME"

  # 可选：Casdoor / Consul
  # CASDOOR_CLIENT_SECRET: "CHANGE_ME"
  # CONSUL_TOKEN: "CHANGE_ME"
