# examples/windows_exporter 默认配置
#
# 该文件用于演示「安装后由脚本写入 C:\Program Files\windows_exporter\config.yaml」。
# 实际部署时可：
#   - 直接修改本文件后，用 install.ps1 -ConfigPath <本文件> 安装；或
#   - 只在控制台一键安装（脚本会生成等价的默认配置），再登录主机替换该文件后重启服务。
#
# 采集器可按需精简；textfile 目录用于接收业务自定义指标（.prom 文件）。
# service 采集器的 exclude 正则用于屏蔽系统/无关服务，避免指标基数过大。
collectors:
  enabled: cpu,logical_disk,physical_disk,memory,os,hardware_info,net,service

collector:
  textfile:
    # 与安装脚本的 -TextfileDir 默认值保持一致（原 zabbix_agentd 目录已改为 monitor）
    directories:
      - C:\monitor\windows_exporter\textfile_inputs
  service:
    # 屏蔽系统服务与常见第三方后台服务，只保留业务服务指标。
    # 如需按环境增删，直接修改这一行正则即可。
