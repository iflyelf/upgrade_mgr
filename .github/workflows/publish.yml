name: 构建并发布(latest)

# 推送到 main 或手动触发即构建, 二进制与镜像统一发布到 latest
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'build/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      build:
        description: 'build upgrade_mgr'
        required: true
        default: 'build upgrade_mgr'
  watch:
    types: [started]

# 同一分支仅保留最新一次构建：快速连续提交时自动取消旧构建，
# 避免多个多架构（QEMU）构建并发堆积、互相拖慢导致镜像迟迟不更新。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 编译多架构二进制并更新 latest Release
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: 计算版本号
        id: ver
        run: echo "version=latest-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 交叉编译控制台
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64 arm; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/upgrade-mgr-linux-$arch ./cmd/server
          done

      - name: 交叉编译 Agent
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          for arch in amd64 arm64 arm; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/upgrade-agent-linux-$arch ./cmd/agent
          done

      - name: 编译 Agent Legacy (Go 1.23, CentOS 6 兼容)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # 安装 Go 1.23（最后支持内核 2.6.32 的版本）
          wget -q https://go.dev/dl/go1.23.12.linux-amd64.tar.gz
          tar -xzf go1.23.12.linux-amd64.tar.gz -C /tmp
          export PATH=/tmp/go/bin:$PATH
          go version
          
          # 使用独立 modfile 编译 legacy Agent
          for arch in amd64 386 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -modfile=build/agent-legacy.mod -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/upgrade-agent-linux-$arch-legacy ./cmd/agent
          done

      - name: 打包并生成校验和
        run: |
          cd dist
          for f in upgrade-*-linux-*; do
            tar -czf "${f}.tar.gz" "$f"
            sha256sum "${f}.tar.gz" >> checksums.txt
          done

      - name: 发布到 latest Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: latest
          prerelease: false
          # 每次覆盖同名 latest Release 的资源
          files: |
            dist/*.tar.gz
            dist/checksums.txt

  # 构建并推送镜像到 latest
  image:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 计算版本号
        id: ver
        run: echo "version=latest-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: 安装 docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: 登录 DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 登录华为云 SWR
        uses: docker/login-action@v4
        with:
          registry: swr.cn-east-3.myhuaweicloud.com
          username: cn-east-3@${{ secrets.HUAWEI_ACCESS_KEY }}
          password: ${{ secrets.HUAWEI_SWR_PASSWORD }}

      - name: 构建并推送镜像(仅 latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/upgrade-mgr:latest
            swr.cn-east-3.myhuaweicloud.com/danxiaonuo/upgrade-mgr:latest

      - name: 清理旧的 workflow 运行记录
        uses: Mattraks/delete-workflow-runs@main
        with:
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 3
