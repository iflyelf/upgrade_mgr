name: 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: 编译多架构二进制
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装 Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 编译控制台
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          make build
          mv bin/upgrade-mgr bin/upgrade-mgr-${{ matrix.os }}-${{ matrix.arch }}

      - name: 编译 Agent
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          make build-agent
          mv bin/upgrade-agent bin/upgrade-agent-${{ matrix.os }}-${{ matrix.arch }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/*

  agent-legacy:
    # CentOS 6（内核 2.6.32）兼容：Go 1.24+ 要求内核 ≥ 3.2，Agent 用 Go 1.23 单独编译
    name: 编译 Agent Legacy (Go 1.23)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装 Go 1.23
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.23.12'

      - name: 运行 Agent 测试 (Go 1.23)
        env:
          GOTOOLCHAIN: local
        run: make test-agent-legacy LEGACY_GO=local

      - name: 编译 Agent (Go 1.23)
        env:
          GOTOOLCHAIN: local
        run: make agent-legacy LEGACY_GO=local

      - name: 上传构建产物
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries-agent-legacy
          path: dist/*

  cleanup:
    name: 清理旧的 workflow 运行记录
    if: github.event_name == 'push'
    needs: [build, agent-legacy]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: 清理旧的 workflow 运行记录
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 3

  release:
    name: 创建版本发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, agent-legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: artifacts/**/*
          generate_release_notes: true
